<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шың 140 — ҰБТ-ға онлайн сынақ тест</title>
<meta name="description" content="Шың 140 — ҰБТ форматындағы онлайн сынақ тест: 5 пән, 120 сұрақ, 140 балл. Жеке пәндер бойынша да тапсыруға болады.">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f9;color:#152033;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.b{text-align:center;padding:16px}
.s{width:40px;height:40px;border-radius:50%;border:4px solid #e3e8f0;border-top-color:#2f6fdb;animation:r .8s linear infinite;margin:0 auto 14px}
@keyframes r{to{transform:rotate(360deg)}}
button{margin-top:14px;border:0;border-radius:10px;padding:10px 18px;background:#2f6fdb;color:#fff;font:inherit;font-weight:700}
</style>
</head>
<body>
<div class="b" id="b"><div class="s"></div><b>Шың 140</b><p id="m">Жүктелуде…</p></div>
<script>
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbzCPl1Nh8aXWC0zeI6wJ-YhPtxqrKNhVrGE5rMOP6WYdpiep6aZR22orR23VQV7Oo1Q/exec';
  var admin = /(^|[?&])page=admin(&|$)/.test(location.search) || location.hash === '#admin';
  function fail(){
    document.getElementById('b').innerHTML = '<b>Шың 140</b><p>Сайт жүктелмеді. Интернетті тексеріп, қайта көріңіз.</p><button onclick="location.reload()">Қайта жүктеу</button>';
  }
  fetch(API + '?api=html&page=' + (admin ? 'admin' : 'index'))
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(html){
      if (html.indexOf('<html') < 0) throw new Error('bad');
      document.open(); document.write(html); document.close();
    })
    .catch(fail);
})();
</script>
</body>
</html>
